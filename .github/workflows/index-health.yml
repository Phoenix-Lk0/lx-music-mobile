name: Index Health Check

on:
  schedule:
    # 每周一 04:00 (UTC) 自动体检
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check source index
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run health check
        continue-on-error: true
        run: python3 .github/scripts/check_index.py

      - name: Commit changes
        run: |
          if git diff --quiet -- library/index.json; then
            echo "索引无变化"
            exit 0
          fi
          git config user.name "otb-index-bot"
          git config user.email "otb-index-bot@users.noreply.github.com"
          git add library/index.json
          git commit -m "chore(index): 自动体检，更新可用状态与故障转移"
          git push
